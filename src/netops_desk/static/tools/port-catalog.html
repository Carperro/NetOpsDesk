<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - Catálogo de Puertos</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/port-catalog.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/port-catalog.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Catálogo de puertos y protocolos</h1>
                <p class="subtitle">Consultá los puertos estándar y sus servicios asociados.</p>

                <div class="search-bar-container">
                    <input type="text" id="search-input" class="form-input" placeholder="Buscar por puerto o servicio (ej: 80, http, ssh)...">
                </div>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite">
                    <div class="table-responsive" role="region" tabindex="0" aria-label="Tabla de resultados">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Puerto</th>
                                    <th>Protocolo</th>
                                    <th>Servicio</th>
                                    <th>Descripción</th>
                                </tr>
                            </thead>
                            <tbody id="ports-tbody">
                                <!-- Se inyecta con JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
