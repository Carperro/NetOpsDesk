<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - Asistente de Resolución</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/troubleshooter.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/troubleshooter.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Asistente de resolución</h1>
                <p class="subtitle">Seleccioná un síntoma para ver las posibles causas y los pasos a seguir.</p>

                <form id="trouble-form" class="trouble-form" novalidate>
                    <div class="form-group">
                        <label for="symptom-select" class="form-label">¿Qué problema estás experimentando?</label>
                        <select id="symptom-select" class="form-input">
                            <option value="sin_internet">Sin acceso a internet</option>
                            <option value="internet_lento">Latencia alta o pérdida de paquetes</option>
                            <option value="dns_falla">No resuelve nombres de dominio</option>
                        </select>
                    </div>
                    <button type="submit" id="diagnose-btn" class="btn-primary">Iniciar Diagnóstico</button>
                </form>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite" hidden>
                    <div class="result-header">
                        <h2>Diagnóstico: <span id="result-symptom-name" class="text-primary">—</span></h2>
                        <p class="text-muted">Revisá cada posible causa y seguí los pasos sugeridos.</p>
                    </div>

                    <div id="causes-container" class="causes-grid">
                        <!-- Las tarjetas se inyectan con JS -->
                    </div>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
