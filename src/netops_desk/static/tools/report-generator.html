<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - Generador de Informes</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/report-generator.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/report-generator.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Generador de informes de diagnóstico</h1>
                <p class="subtitle">Documentá tus hallazgos y generá un reporte en formato Markdown.</p>

                <form id="report-form" class="report-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Título del Informe</label>
                            <input type="text" id="title-input" class="form-input" placeholder="Ej: Diagnóstico de red - Oficina Central" required>
                        </div>
                        <div class="form-group">
                            <label>Técnico / Autor</label>
                            <input type="text" id="author-input" class="form-input" placeholder="Tu nombre">
                        </div>
                    </div>

                    <div class="findings-section">
                        <div class="findings-header">
                            <h3>Hallazgos del Diagnóstico</h3>
                            <button type="button" id="add-finding-btn" class="btn-secondary">+ Agregar Hallazgo</button>
                        </div>
                        <div id="findings-container">
                            <!-- Las filas de hallazgos se inyectan acá con JS -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Conclusión (Opcional)</label>
                        <input type="text" id="conclusion-input" class="form-input" placeholder="Ej: La red funciona correctamente, se recomienda cambiar el DNS.">
                    </div>

                    <button type="submit" id="generate-btn" class="btn-primary">Generar Informe Markdown</button>
                </form>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite" hidden>
                    <div class="result-header">
                        <h2>Informe Generado</h2>
                        <button type="button" id="copy-btn" class="btn-secondary">📋 Copiar al portapapeles</button>
                    </div>
                    <textarea id="markdown-output" class="markdown-output" readonly></textarea>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
