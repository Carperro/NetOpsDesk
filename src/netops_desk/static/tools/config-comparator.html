<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - Comparador de Configuraciones</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/config-comparator.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/config-comparator.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Comparador de configuraciones</h1>
                <p class="subtitle">Pegá dos versiones de una configuración para ver qué cambió.</p>

                <div class="compare-inputs">
                    <div class="input-group">
                        <label>Configuración Original (A)</label>
                        <textarea id="config-a" class="form-textarea" placeholder="Pegá la configuración vieja acá..."></textarea>
                    </div>
                    <div class="input-group">
                        <label>Configuración Nueva (B)</label>
                        <textarea id="config-b" class="form-textarea" placeholder="Pegá la configuración nueva acá..."></textarea>
                    </div>
                </div>

                <div class="actions-bar">
                    <button id="compare-btn" class="btn-primary">Comparar Configuraciones</button>
                    <button id="clear-btn" class="btn-secondary">Limpiar Todo</button>
                </div>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite" hidden>
                    <h2>Diferencias encontradas</h2>
                    <div id="diff-output" class="diff-output">
                        <!-- Las líneas del diff se inyectan acá -->
                    </div>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
