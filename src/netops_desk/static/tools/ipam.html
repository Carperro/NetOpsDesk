<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - IPAM</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/ipam.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/ipam.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Gestor de direcciones IP</h1>
                <p class="subtitle">Registra y administra las direcciones IP de tu red para evitar conflictos.</p>

                <form id="ipam-form" class="ipam-form" novalidate>
                    <input type="hidden" id="record-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Dirección IP</label>
                            <input type="text" id="ip-input" class="form-input" placeholder="Ej: 192.168.1.50" required>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select id="status-input" class="form-input">
                                <option value="available">Disponible (Available)</option>
                                <option value="assigned">Asignada (Assigned)</option>
                                <option value="reserved">Reservada (Reserved)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Asignado a</label>
                            <input type="text" id="assigned-input" class="form-input" placeholder="Ej: Servidor NAS, Impresora, etc.">
                        </div>
                        <div class="form-group">
                            <label>Notas</label>
                            <input type="text" id="notes-input" class="form-input" placeholder="Observaciones">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="save-btn" class="btn-primary">Registrar IP</button>
                        <button type="button" id="cancel-btn" class="btn-secondary" hidden>Cancelar Edición</button>
                    </div>
                </form>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite" style="margin-top: 2rem;">
                    <h2>Direcciones Registradas</h2>
                    <div class="table-responsive" role="region" tabindex="0" aria-label="Tabla de resultados">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Dirección IP</th>
                                    <th>Estado</th>
                                    <th>Asignado a</th>
                                    <th>Notas</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="ips-tbody">
                                <!-- Se inyecta con JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
