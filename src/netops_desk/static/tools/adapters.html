<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - Estado de Adaptadores</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/adapters.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/adapters.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Estado de adaptadores</h1>
                <p class="subtitle">Consulta el estado físico, velocidad y MTU de las tarjetas de red.</p>

                <button id="execute-btn" class="btn-primary" style="margin: 1.5rem 0;">Consultar Adaptadores</button>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite" hidden>
                    <h2>Adaptadores de Red</h2>
                    <div class="table-responsive" role="region" tabindex="0" aria-label="Tabla de resultados">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Estado</th>
                                    <th>Velocidad</th>
                                    <th>MTU</th>
                                    <th>Multicast</th>
                                </tr>
                            </thead>
                            <tbody id="adapters-tbody">
                                <!-- Se inyecta con JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
