<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetOps Desk - Traceroute</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/traceroute.css">
    <script src="/static/js/sidebar.js" defer></script>
    <script src="/static/js/common.js" defer></script>
    <script src="/static/js/api-errors.js" defer></script>
    <script src="/static/js/traceroute.js" defer></script>
</head>
<body id="top">
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <span aria-hidden="true">🔍</span>
                    <input type="text" placeholder="Buscar herramientas...">
                </div>
            </header>

            <div class="page-container">
                <h1>Traceroute</h1>
                <p class="subtitle">Mapeá la ruta que siguen los paquetes hasta un host destino.</p>

                <form id="traceroute-form" class="traceroute-form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="host-input" class="form-label">Host (IP o Dominio)</label>
                            <input type="text" id="host-input" class="form-input" placeholder="Ej: 8.8.8.8 o google.com" required>
                        </div>
                        <div class="form-group">
                            <label for="hops-input" class="form-label">Máx. Saltos</label>
                            <input type="number" id="hops-input" class="form-input" min="1" max="30" value="15" required>
                        </div>
                    </div>
                    <button type="submit" id="execute-btn" class="btn-primary">Ejecutar Traceroute</button>
                </form>

                <div id="error-container" class="error-message" role="alert" hidden></div>

                <section id="result-container" class="result-container" aria-live="polite" hidden>
                    <div class="result-header">
                        <h2>Ruta hacia: <span id="result-host" class="text-primary">—</span></h2>
                        <p class="text-muted">IP Resuelta: <span id="result-resolved-ip">—</span></p>
                    </div>

                    <div class="table-responsive" role="region" tabindex="0" aria-label="Tabla de resultados">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Salto</th>
                                    <th>IP</th>
                                    <th>Tiempos (ms)</th>
                                </tr>
                            </thead>
                            <tbody id="hops-tbody">
                                <!-- Se inyecta con JS -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
            
            <footer class="site-footer">
                <p>&copy; <span id="current-year"></span> NetOps Desk. Todos los derechos reservados.</p>
            </footer>
        </main>
    </div>
    <a href="#top" class="back-to-top" aria-label="Volver al inicio de la página">↑</a>
</body>
</html>
